name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  offline-tests:
    name: Offline tests and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # Pinned to the version that generated uv.lock (see [tool.uv] required-version in pyproject.toml)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.10.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version pins 3.12; uv installs and manages the interpreter itself
      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: i18n consistency
        run: uv run python tools/check_i18n.py

      # Only tests that need neither a live server nor a running Ollama instance.
      # Excluded on purpose (they need the API/Ollama): test_api.py, test_bm25_simple.py,
      # test_hybrid_search_demo.py.
      - name: Offline test subset
        run: |
          uv run pytest -q \
            tests/test_boundary_detector.py \
            tests/test_query_rewrite.py \
            tests/test_retriever.py \
            tests/test_regression.py \
            tests/test_evaluator.py \
            tests/test_llm_citations.py \
            tests/test_doc_analyzer.py \
            tests/test_abtest_integration.py \
            tests/test_async_tasks_kb.py \
            tests/test_i18n_consistency.py \
            tests/test_http_encoding.py \
            tests/test_parser.py \
            tests/test_path_safety.py \
            tests/test_retrieval_funnel.py \
            tests/test_chat_debug_endpoints.py \
            tests/test_retrieval_defaults.py \
            tests/test_abtest_rules.py \
            tests/test_text_split.py \
            tests/test_sentence_tracing.py \
            tests/test_streaming_trace_offsets.py \
            tests/test_contradiction.py \
            tests/test_retrieval_degradation.py \
            tests/test_hybrid_disclaimer_dedupe.py

      # `.flake8` is gitignored (local convenience only), so the exclusion that keeps the uv
      # environment out of the lint run is passed explicitly here.
      - name: Lint (syntax errors and undefined names)
        run: |
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --extend-exclude=.venv,venv,env,ENV,.git,storage

      - name: Byte-compile the entry points
        run: |
          uv run python -m compileall -q main.py api core service config tools scripts docAnalyze.py
