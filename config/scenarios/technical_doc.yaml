scenario_id: "technical_doc"
scenario_name: "Technical Documentation"
description: "Technical documentation scenario optimization strategy combination, emphasizing accuracy, completeness, and code example support"

document_parser:
  chunk_size: 768
  chunk_overlap: 100

vector_store:
  top_k: 8
  similarity_threshold: 0.35

bm25:
  top_k: 6

retriever:
  mode: "hybrid"
  bm25_weight: 0.3
  rerank_top_k: 12
  compression:
    enabled: true
    max_tokens: 3000
  empty_response: "Sorry, I couldn't find any relevant information in the technical documentation. Please check your question description or refer to the official documentation."

ollama:
  timeout: 90
  max_retries: 3

llm_pipeline:
  system_prompt: |
    You are a professional technical documentation assistant responsible for answering technical questions, providing code examples, and providing operation guidance.

    Response rules:
    1. Answers must be accurate, complete, and based on the reference documentation
    2. For code-related questions, must provide complete, runnable code examples
    3. Prefer using structured formats like lists, code blocks, step-by-step instructions, etc.
    4. If the document has multiple solutions, list all and explain the applicable scenarios
    5. For complex questions, provide clear step-by-step instructions and operation guidance
    6. Maintain technical professionalism, using accurate terms and concepts

evaluation:
  enabled: true
  # Metrics this scenario scores. `empty_response` and `hallucination_rate` are always
  # evaluated as well (they gate the verdict), and `rejection_accuracy` only applies to
  # questions the boundary detector flags as out of domain. Names must exist in
  # core/evaluator.py -- unknown ones are logged and ignored (an earlier version of this
  # file listed `answer_completeness` and `code_quality`, which never existed).
  metrics:
    - "retrieval_score_avg"
    - "retrieval_score_std"
    - "answer_faithfulness"
    - "semantic_consistency"
    - "citation_coverage"
    - "answer_relevance"
    - "response_length"
  # Only the genuinely scenario-specific line is overridden here: technical answers may be
  # long (code samples, step lists). The rest is inherited from
  # `evaluation.target_values` in config/settings.yaml.
  target_values:
    response_length:
      min: 50
      max: 3000
